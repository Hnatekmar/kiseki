apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-env.fullname" . }}
  labels:
    {{- include "dev-env.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dev-env.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-env.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: dev-env
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/etc/dev-env/up.sh"]
          ports:
            - name: ssh
              containerPort: 22
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: provision
              mountPath: /etc/dev-env
              readOnly: true
            - name: ssh-key
              mountPath: /etc/dev-ssh
              readOnly: true
{{ if .Values.storage.enabled }}
            - name: data
              mountPath: /data
{{ end }}
      volumes:
        - name: provision
          configMap:
            name: {{ include "dev-env.fullname" . }}-provision
        - name: ssh-key
          secret:
            secretName: {{ include "dev-env.fullname" . }}-ssh-key
            defaultMode: 0600
{{ if .Values.storage.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dev-env.fullname" . }}
{{ end }}
