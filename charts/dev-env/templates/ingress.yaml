{{- $ingress := .Values.ingress | default dict }}
{{- if $ingress.enabled }}
{{- if not $ingress.host }}
{{- fail "ingress.host is required when ingress.enabled is true" }}
{{- end }}
{{- $annotations := dict }}
{{- if $ingress.tls }}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" $ingress.clusterIssuer }}
{{- end }}
{{- range $key, $value := ($ingress.annotations | default dict) }}
{{- $_ := set $annotations $key $value }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dev-env.fullname" . }}
  labels:
    {{- include "dev-env.labels" . | nindent 4 }}
{{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  ingressClassName: {{ $ingress.className }}
{{- if $ingress.tls }}
  tls:
    - hosts:
        - {{ $ingress.host | quote }}
      secretName: {{ include "dev-env.fullname" . }}-tls
{{- end }}
  rules:
    - host: {{ $ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dev-env.fullname" . }}
                port:
                  name: http
{{- end }}
