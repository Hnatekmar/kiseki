apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dev-env.fullname" . }}-ssh-key
  labels:
    {{- include "dev-env.labels" . | nindent 4 }}
type: Opaque
stringData:
  authorized_keys: {{ required "ssh.authorizedKey is required — pass --set-file ssh.authorizedKey=<path/to/key.pub>" .Values.ssh.authorizedKey | quote }}