apiVersion: v1
kind: Service
metadata:
  name: {{ include "kiseki.fullname" . }}
  labels:
    {{- include "kiseki.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
{{- $ingress := .Values.ingress | default dict }}
{{- if $ingress.enabled }}
    - name: http
      port: {{ int $ingress.port }}
      targetPort: http
      protocol: TCP
{{- end }}
  selector:
    {{- include "kiseki.selectorLabels" . | nindent 4 }}
