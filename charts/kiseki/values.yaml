image:
  # Prebuilt base with the provisioning prerequisites already installed
  # (openssh-server, zsh, git, rsync, curl, tar, findutils, python3, gcc, make,
  # socat, docker-cli, procps-ng, hostname, iproute, which, lsof, diffutils, patch). Packages under
  # hnatekmar/kiseki are anonymously
  # pullable, so environments need no imagePullSecret.
  #
  # Falling back to `fedora` works: up.sh and dots install what they need, at the
  # cost of Fedora mirror fetches on every start. Build the image with
  # `just base-image`.
  repository: forgejo.srv.hnatekmar.dev/hnatekmar/kiseki/base
  # Immutable tag -- bump it whenever images/base is rebuilt. pullPolicy is
  # IfNotPresent, so a reused tag leaves nodes on cached layers.
  tag: "fedora45-4"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 8Gi

# Tolerations for the environment pod. The default admits the control-plane taint
# that kubeadm applies on single-node clusters (kind, k3s, a lab box): a dev
# environment has no reason to stay off the only node. An environment created with
# --gpu also gets a toleration for nvidia.com/gpu.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# The dotfiles bootstrap clones a repository and runs its installer at container
# start. It is the slowest part of a first start and needs GitHub plus whatever
# the installer pulls, so it is skippable: an environment that only needs a
# shell, and the CI smoke test, can turn it off.
dots:
  enabled: true
  repo: https://github.com/Hnatekmar/dots.git

  # Wall-clock cap on the bootstrap, in seconds. A stalled external fetch
  # otherwise keeps the container from ever reaching sshd: the pod sits 0/1 and
  # the only way in is `kubectl logs`. On timeout sshd starts anyway and the
  # timeout is logged; the bootstrap is idempotent, so re-running
  # `dots-bootstrap.sh` inside the environment resumes where it stopped.
  timeout: 1200

  # Shared download cache: mounted at `mountPath` and exported to the bootstrap
  # as DOTS_CACHE_DIR. Without it every environment re-downloads ~1.2G of release
  # assets; with it, only the first environment after a version bump touches the
  # network. Requires the NFS export to exist, and is ignored when dots.enabled
  # is false — the mount is a hard NFS mount, so a missing export leaves the pod
  # in ContainerCreating rather than failing softly. Defaulting it on is
  # deliberate: this chart is deployed only to the homelab dev cluster, where the
  # export always exists. Anywhere else, set enabled: false.
  cache:
    enabled: true
    server: truenas.storage.hnatekmar.dev
    path: /mnt/data/k8s/workspace/cache
    mountPath: /cache/dots

gpu:
  enabled: false
  count: 1
  runtimeClassName: nvidia

ssh:
  authorizedKey: ""

fullnameOverride: ""

storage:
  # Persist the container's home directory. Everything installed under /root
  # (dotfiles, toolchains, shell history, the dots bootstrap) survives a pod
  # restart. /workdir stays ephemeral: it only holds the dots checkout that
  # provisioning pulls on every start.
  enabled: false
  size: 10Gi
  storageClass: truenas-nvmeof

# One container port published through an Ingress. The dev container listens on
# `port`; the chart adds a Service port and an Ingress rule for `host`.
# TLS is issued by cert-manager, so the cluster needs the named ClusterIssuer.
ingress:
  enabled: false
  className: nginx
  host: ""
  port: 3000
  clusterIssuer: letsencrypt-cloudflare
  tls: true
  annotations: {}

# Extra ports declared on the dev container (second server, debugger). Nothing
# routes to them; they document the surface in the pod spec.
ports: []

# Extra volumes for sidecars, and mounts for the dev container. A volume is
# only useful to the dev container if it also appears in extraVolumeMounts;
# sidecars mount it through their own volumeMounts.
#   extraVolumes:
#     - name: pgdata
#       emptyDir: {}
#   extraVolumeMounts:
#     - name: pgdata
#       mountPath: /var/lib/postgresql   # only if the dev container needs it
extraVolumes: []
extraVolumeMounts: []

# Containers that run to completion before the dev container and sidecars
# start (database seeding, migrations, permission fixes).
extraInitContainers: []

# Sidecar containers that share the dev pod's network namespace, so the dev
# container reaches them on 127.0.0.1:<port>. Declaring a port makes the
# provisioning script wait for it before sshd starts.
#   extraContainers:
#     - name: redis
#       image: redis:7-alpine
#       ports:
#         - name: redis
#           containerPort: 6379
#       env:
#         - name: REDIS_ARGS
#           value: "--appendonly yes"
#       resources:
#         requests: {cpu: 50m, memory: 64Mi}
#         limits: {cpu: 500m, memory: 256Mi}
extraContainers: []

# docker:dind sidecar. The dev container gets DOCKER_HOST pointing at it and
# the provisioning script installs the docker CLI. Requires a privileged
# container, so the namespace needs the privileged Pod Security level:
# `kiseki create --docker` labels the namespace it creates. A chart installed
# by hand must set that label first, or the pod is rejected on clusters that
# enforce baseline.
docker:
  enabled: false
  image:
    repository: docker
    tag: "28-dind"
    pullPolicy: IfNotPresent
  storage:
    sizeLimit: 20Gi
